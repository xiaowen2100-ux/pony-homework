<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#FF69B4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="暑假作业">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<title>小马宝莉·暑假作业工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ========== Reset & Base ========== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{font-family:'Noto Sans SC',sans-serif;background:linear-gradient(135deg,#FFE0F0 0%,#E8D5F2 40%,#D6EAF8 100%);background-attachment:fixed;min-height:100vh;color:#4A3B5C;font-size:15px;line-height:1.6}
h1,h2,h3,h4{font-family:'ZCOOL KuaiLe','Noto Sans SC',sans-serif;font-weight:400}
button{font-family:inherit;cursor:pointer;border:none;outline:none;transition:all .2s}
input,textarea,select{font-family:inherit;outline:none}
:root{
  --pink:#FF69B4;--light-pink:#FFB6D9;--pale-pink:#FFF0F5;
  --purple:#9B59B6;--light-purple:#D7BDE2;--pale-purple:#F4ECF7;
  --blue:#5DADE2;--light-blue:#AED6F1;--pale-blue:#EBF5FB;
  --gold:#FFD700;--green:#2ECC71;--red:#E74C3C;
  --card-bg:rgba(255,255,255,.92);--card-shadow:0 4px 20px rgba(155,89,182,.15);
  --radius:16px;--radius-sm:10px;
}

/* ========== Layout ========== */
#app{max-width:900px;margin:0 auto;min-height:100vh;padding-bottom:80px;position:relative}
.header{background:linear-gradient(135deg,var(--pink),var(--purple));padding:14px 16px;border-radius:0 0 24px 24px;box-shadow:0 4px 20px rgba(155,89,182,.3);position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:10px}
.header-title{color:#fff;font-size:18px;display:flex;align-items:center;gap:6px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.heart-badge{background:rgba(255,255,255,.25);backdrop-filter:blur(6px);border-radius:20px;padding:4px 12px;color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.mode-toggle{background:rgba(255,255,255,.25);backdrop-filter:blur(6px);border-radius:20px;padding:4px;display:flex;gap:2px}
.mode-btn{background:transparent;color:rgba(255,255,255,.7);padding:5px 12px;border-radius:16px;font-size:13px;font-weight:500;white-space:nowrap}
.mode-btn.active{background:#fff;color:var(--purple)}

/* ========== Views ========== */
.view{display:none;padding:16px;animation:fadeIn .3s ease}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ========== Cards ========== */
.card{background:var(--card-bg);backdrop-filter:blur(10px);border-radius:var(--radius);box-shadow:var(--card-shadow);padding:16px;margin-bottom:14px;border:1px solid rgba(255,255,255,.5)}
.card-title{font-size:17px;color:var(--purple);margin-bottom:10px;display:flex;align-items:center;gap:6px;justify-content:space-between}
.card-title span:first-child{display:flex;align-items:center;gap:6px}

/* ========== Pet ========== */
.pet-section{display:flex;gap:14px;align-items:center}
.pet-svg-wrap{flex-shrink:0;width:130px;height:130px;display:flex;align-items:center;justify-content:center;position:relative}
.pet-svg{width:100%;height:100%;transition:all .5s ease}
.pet-svg.state-shiny{animation:bounce 2s ease-in-out infinite;filter:drop-shadow(0 0 8px rgba(255,215,0,.6))}
.pet-svg.state-happy{animation:wiggle 3s ease-in-out infinite}
.pet-svg.state-weak{opacity:.8;transform:scale(.88)}
.pet-svg.state-sad{opacity:.6;transform:scale(.78);animation:shiver 2s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
@keyframes shiver{0%,100%{transform:scale(.78) translateX(0)}50%{transform:scale(.78) translateX(-2px)}}
.sparkle{position:absolute;font-size:16px;animation:sparkleAnim 1.5s ease-in-out infinite;pointer-events:none}
.sparkle:nth-child(2){animation-delay:.3s}
.sparkle:nth-child(3){animation-delay:.6s}
.sparkle:nth-child(4){animation-delay:.9s}
@keyframes sparkleAnim{0%,100%{opacity:0;transform:scale(0) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(180deg)}}
.pet-info{flex:1}
.pet-name{font-size:18px;color:var(--purple);margin-bottom:4px}
.pet-state-label{font-size:14px;padding:4px 10px;border-radius:12px;display:inline-block;margin-bottom:6px}
.pet-state-label.s-shiny{background:linear-gradient(90deg,#FFD700,#FF69B4);color:#fff}
.pet-state-label.s-happy{background:var(--pale-pink);color:var(--pink)}
.pet-state-label.s-weak{background:#FDF2E9;color:#E67E22}
.pet-state-label.s-sad{background:#EEE;color:#777}
.pet-hearts{font-size:20px;font-weight:700;color:var(--pink);display:flex;align-items:center;gap:4px}

/* ========== Days Countdown ========== */
.days-card{background:linear-gradient(135deg,#FFF9C4,#FFE082);border-radius:var(--radius);padding:14px 16px;text-align:center;box-shadow:var(--card-shadow);border:1px solid rgba(255,215,0,.3)}
.days-number{font-size:36px;font-family:'ZCOOL KuaiLe',sans-serif;color:#F57F17;line-height:1.2}
.days-label{font-size:13px;color:#795548}

/* ========== Progress Bar ========== */
.progress-bar{height:10px;background:#EEE;border-radius:5px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--pink),var(--purple));border-radius:5px;transition:width .5s ease}
.progress-text{font-size:13px;color:#888;margin-top:4px}

/* ========== Task List ========== */
.subject-section{margin-bottom:12px}
.subject-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--pale-purple);border-radius:var(--radius-sm);cursor:pointer;user-select:none}
.subject-header:hover{background:var(--light-purple)}
.subject-header-left{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;color:var(--purple)}
.subject-count{background:#fff;color:var(--purple);padding:2px 8px;border-radius:10px;font-size:12px;font-weight:700}
.subject-tasks{overflow:hidden;transition:max-height .3s ease;max-height:500px}
.subject-tasks.collapsed{max-height:0}
.task-item{display:flex;align-items:center;gap:10px;padding:12px 14px;margin:6px 8px 0;background:#fff;border-radius:var(--radius-sm);box-shadow:0 2px 8px rgba(0,0,0,.05);cursor:pointer;transition:all .2s;border:2px solid transparent}
.task-item:hover{transform:translateX(4px);box-shadow:0 4px 12px rgba(155,89,182,.15)}
.task-item.completed{border-color:var(--green);background:linear-gradient(90deg,#E8F8F5,#fff)}
.task-check{width:26px;height:26px;border-radius:50%;border:3px solid #DDD;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;transition:all .3s}
.task-item.completed .task-check{background:var(--green);border-color:var(--green);color:#fff}
.task-info{flex:1;min-width:0}
.task-name{font-size:15px;font-weight:500;color:#4A3B5C}
.task-name.done{text-decoration:line-through;color:#AAA}
.task-desc{font-size:12px;color:#999}
.task-reward{font-size:13px;color:var(--pink);font-weight:700;white-space:nowrap}
.task-item.completed .task-reward{color:var(--green)}

/* ========== Buttons ========== */
.btn{padding:10px 20px;border-radius:var(--radius-sm);font-size:15px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;box-shadow:0 4px 12px rgba(255,105,180,.3)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(255,105,180,.4)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-secondary{background:#fff;color:var(--purple);border:2px solid var(--light-purple)}
.btn-secondary:hover{background:var(--pale-purple)}
.btn-success{background:linear-gradient(135deg,#2ECC71,#27AE60);color:#fff;box-shadow:0 4px 12px rgba(46,204,113,.3)}
.btn-danger{background:linear-gradient(135deg,#E74C3C,#C0392B);color:#fff}
.btn-warning{background:linear-gradient(135deg,#FF9800,#F57C00);color:#fff}
.btn-block{width:100%}
.btn-sm{padding:6px 14px;font-size:13px}
.btn-icon{width:40px;height:40px;border-radius:50%;padding:0;font-size:18px}

/* ========== Task Detail ========== */
.task-detail-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back-btn{background:#fff;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.task-detail-title{font-size:20px;color:var(--purple)}
.content-box{background:linear-gradient(135deg,var(--pale-pink),var(--pale-purple));border-radius:var(--radius);padding:18px;margin-bottom:14px;border:2px dashed var(--light-pink);position:relative}
.content-box .content-label{font-size:13px;color:var(--purple);margin-bottom:8px;font-weight:500}
.content-text{font-size:17px;line-height:2;color:#4A3B5C;white-space:pre-wrap}
.content-text-en{font-size:18px;line-height:2.2;font-family:Georgia,serif}
.content-text ruby{ruby-position:over}
.content-text rt{font-size:11px;color:#9B59B6;line-height:1.2;font-weight:400}
.content-text-pinyin{font-size:16px;line-height:2.4;letter-spacing:.5px}
.content-text-pinyin ruby{ruby-position:over}
.content-text-pinyin rt{font-size:10px;color:#9B59B6;line-height:1.2}
.char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px;margin:10px 0}
.char-card{background:var(--pale-pink);border-radius:var(--radius-sm);padding:12px 6px;text-align:center;border:2px solid transparent;transition:all .2s;cursor:pointer}
.char-card.learned{border-color:var(--green);background:#E8F8F5}
.char-card ruby{ruby-position:over}
.char-card rt{font-size:12px;color:var(--purple);font-weight:500}
.char-card .char-char{font-size:28px;font-weight:700;color:#4A3B5C;margin:2px 0}
.char-card .char-words{font-size:11px;color:#888;margin-top:4px;line-height:1.4}
.char-card .char-status{font-size:10px;margin-top:4px}
.dictation-words{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.dictation-word-item{background:var(--pale-purple);padding:8px 14px;border-radius:10px;font-size:16px;color:#4A3B5C}
.dictation-play-list{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.dictation-play-item{display:flex;align-items:center;gap:12px;background:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.dictation-play-item .dictation-number{font-size:18px;font-weight:700;color:var(--purple);min-width:24px}
.dictation-hidden-msg{text-align:center;padding:16px;color:#aaa;font-style:italic}
.housework-reward{display:inline-block;background:var(--pale-pink);color:var(--pink);font-size:12px;padding:2px 8px;border-radius:10px;margin-left:4px}
.word-list{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.word-chip{background:#fff;padding:6px 14px;border-radius:20px;font-size:16px;box-shadow:0 2px 6px rgba(0,0,0,.08);cursor:pointer;transition:all .2s}
.word-chip:hover{background:var(--pale-pink);transform:translateY(-2px)}
.sentence-item{background:#fff;padding:8px 14px;border-radius:10px;margin:6px 0;font-size:16px;box-shadow:0 2px 6px rgba(0,0,0,.05)}

/* ========== Recording ========== */
.record-section{text-align:center;padding:20px;background:var(--pale-pink);border-radius:var(--radius);margin-bottom:14px}
.record-btn{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#FF6B6B,#EE5A24);display:inline-flex;align-items:center;justify-content:center;font-size:32px;color:#fff;box-shadow:0 6px 20px rgba(238,90,36,.4);transition:all .3s}
.record-btn:hover{transform:scale(1.05)}
.record-btn.recording{background:linear-gradient(135deg,#E74C3C,#C0392B);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.record-timer{font-size:20px;font-weight:700;color:var(--purple);margin:10px 0}
.record-status{font-size:14px;color:#888}
.playback-section{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.tts-btn{background:linear-gradient(135deg,var(--blue),#2980B9);color:#fff;padding:10px 20px;border-radius:var(--radius-sm);font-size:15px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 4px 12px rgba(93,173,226,.3)}
.tts-btn.playing{animation:pulse 1s ease-in-out infinite}

/* ========== Upload ========== */
.upload-area{border:3px dashed var(--light-purple);border-radius:var(--radius);padding:30px;text-align:center;background:var(--pale-purple);cursor:pointer;transition:all .2s}
.upload-area:hover{border-color:var(--purple);background:#F4ECF7}
.upload-icon{font-size:48px;margin-bottom:8px}
.upload-text{color:var(--purple);font-size:15px}
.image-preview{max-width:100%;border-radius:var(--radius);margin-top:10px;box-shadow:0 4px 12px rgba(0,0,0,.1)}

/* ========== Bottom Nav ========== */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:900px;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-top:1px solid rgba(155,89,182,.15);display:flex;justify-content:space-around;padding:8px 0;z-index:100;box-shadow:0 -4px 20px rgba(0,0,0,.05)}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 16px;border-radius:10px;color:#AAA;font-size:12px;cursor:pointer;transition:all .2s;background:none;border:none}
.nav-item.active{color:var(--pink)}
.nav-item.active .nav-icon{transform:scale(1.15)}
.nav-icon{font-size:22px;transition:transform .2s}

/* ========== Shop ========== */
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.shop-item{background:#fff;border-radius:var(--radius);padding:16px;text-align:center;box-shadow:var(--card-shadow);border:2px solid transparent;transition:all .2s}
.shop-item:hover{border-color:var(--pink);transform:translateY(-3px)}
.shop-icon{font-size:48px;margin-bottom:8px}
.shop-name{font-size:14px;font-weight:500;color:#4A3B5C;margin-bottom:4px}
.shop-cost{font-size:16px;color:var(--pink);font-weight:700;margin-bottom:8px}
.shop-item.exchanged{opacity:.5}
.shop-badge{position:absolute;top:8px;right:8px;background:var(--green);color:#fff;font-size:11px;padding:2px 8px;border-radius:10px}

/* ========== Parent Views ========== */
.stat-row{display:flex;gap:10px;flex-wrap:wrap}
.stat-card{flex:1;min-width:100px;background:#fff;border-radius:var(--radius-sm);padding:12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.stat-value{font-size:24px;font-weight:700;font-family:'ZCOOL KuaiLe',sans-serif}
.stat-label{font-size:12px;color:#888}
.stat-card.chinese .stat-value{color:var(--red)}
.stat-card.math .stat-value{color:var(--blue)}
.stat-card.english .stat-value{color:var(--green)}
.stat-card.total .stat-value{color:var(--purple)}

.heart-log{max-height:300px;overflow-y:auto}
.heart-log-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid #F0F0F0;font-size:14px}
.heart-log-item .log-reason{flex:1;color:#555}
.heart-log-item .log-amount{font-weight:700;font-size:16px}
.heart-log-item .log-amount.positive{color:var(--green)}
.heart-log-item .log-amount.negative{color:var(--red)}

.parent-task-item{display:flex;align-items:center;gap:10px;padding:12px;background:#fff;border-radius:var(--radius-sm);margin-bottom:8px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.parent-task-item .task-controls{margin-left:auto;display:flex;gap:6px}

.grading-card{background:#fff;border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--card-shadow)}
.grading-image{max-width:100%;border-radius:var(--radius-sm);margin:8px 0}
.grading-form{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.grading-form input{width:60px;padding:8px;border:2px solid var(--light-purple);border-radius:8px;font-size:16px;text-align:center}
.grading-result{padding:8px 14px;border-radius:10px;font-weight:700;margin-top:8px}

/* ========== Chart ========== */
.chart-container{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--card-shadow)}
.chart-svg{width:100%;height:auto}

/* ========== Modal ========== */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-overlay.active{display:flex;animation:fadeIn .2s}
.modal-content{background:#fff;border-radius:var(--radius);padding:20px;max-width:400px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal-title{font-size:20px;color:var(--purple);margin-bottom:14px}
.modal-body{margin-bottom:14px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}
.form-group{margin-bottom:12px}
.form-label{display:block;font-size:14px;color:#666;margin-bottom:4px}
.form-input{width:100%;padding:10px;border:2px solid #EEE;border-radius:8px;font-size:15px;transition:border-color .2s}
.form-input:focus{border-color:var(--pink)}
.form-select{width:100%;padding:10px;border:2px solid #EEE;border-radius:8px;font-size:15px;background:#fff}

/* ========== Toast ========== */
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 24px;border-radius:20px;font-size:14px;z-index:2000;animation:toastSlide 2.5s ease forwards;pointer-events:none}
@keyframes toastSlide{0%{opacity:0;transform:translateX(-50%) translateY(-10px)}15%,85%{opacity:1;transform:translateX(-50%) translateY(0)}100%{opacity:0;transform:translateX(-50%) translateY(-10px)}}

/* ========== Heart Pop Animation ========== */
.heart-pop{position:fixed;font-size:36px;pointer-events:none;z-index:3000;animation:heartFloat 1.2s ease-out forwards}
@keyframes heartFloat{0%{opacity:1;transform:translateY(0) scale(.5)}30%{transform:translateY(-20px) scale(1.5)}100%{opacity:0;transform:translateY(-70px) scale(1)}}

/* ========== Confetti ========== */
.confetti{position:fixed;top:-10px;width:10px;height:10px;z-index:9999;animation:confettiFall 2.5s ease-in forwards;pointer-events:none}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

/* ========== Responsive ========== */
@media(max-width:600px){
  .header-title{font-size:15px}
  .pet-svg-wrap{width:100px;height:100px}
  .days-number{font-size:28px}
  .task-detail-title{font-size:17px}
  .content-text{font-size:15px}
  .content-text-pinyin{font-size:14px;line-height:2.6}
  .content-text-pinyin rt{font-size:9px}
  .nav-item{padding:6px 10px}
  .stat-card{min-width:80px}
  .char-grid{grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
  .char-card .char-char{font-size:24px}
  .dictation-word-item{font-size:14px;padding:6px 10px}
  .dictation-play-item{padding:8px 10px}
}
@media(min-width:601px){
  .pet-section{flex-direction:row}
}
</style>
</head>
<body>
<div id="app"></div>

<!-- Modal Container -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-content" id="modalContent"></div>
</div>

<script>
// ====================================================================
// 小马宝莉·暑假作业工作台

// 拼音标注函数：为非一年级生字添加ruby拼音
function annotatePinyin(text){
  let result='';
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(/[\u4e00-\u9fff]/.test(ch)){
      if(GRADE1_CHARS.has(ch)){
        result+=ch;
      }else if(PINYIN_DICT[ch]){
        result+='<ruby>'+ch+'<rt>'+PINYIN_DICT[ch]+'</rt></ruby>';
      }else{
        result+=ch;
      }
    }else{
      result+=ch;
    }
  }
  return result;
}

    {title:"秋天的果园",content:"秋天的果园里，果实累累，到处都弥漫着甜甜的香气。红彤彤的苹果压弯了枝头，像一个个小灯笼，在阳光下闪闪发亮。黄澄澄的梨子你挤我碰，争着让人去摘。一串串葡萄挂在架子上，紫得像玛瑙，绿得像翡翠。柿子树上的柿子像红红的灯笼挂满枝头，石榴咧开嘴笑了，露出一颗颗晶莹剔透的红宝石般的籽。农民伯伯脸上洋溢着喜悦的笑容，有的在采摘水果，有的在装箱搬运，忙得不亦乐乎。几只小鸟停在枝头，叽叽喳喳地唱着歌，好像也在庆祝丰收。秋风吹过，几片金黄的落叶飘飘悠悠地落下来，像一只只金色的蝴蝶在空中飞舞。秋天的果园真是一幅美丽的丰收图！"},
    {title:"冬天的第一场雪",content:"今天下雪了，这是冬天的第一场雪。雪花像轻盈的白蝴蝶，纷纷扬扬地飘落下来，又像洁白的羽毛，轻轻地落在地上。不一会儿，屋顶白了，树枝白了，大地像铺上了一层厚厚的白地毯，整个世界变成了一个银白色的童话王国。我和小伙伴们兴奋地冲出家门，在雪地里堆了一个大雪人。我们给它戴上一顶红帽子，插上一根胡萝卜鼻子，用两颗黑纽扣做眼睛，还围上了一条蓝围巾。雪人站在雪地里，笑眯眯地看着我们，好像在说我们一起玩吧！我们在雪地里打雪仗、滑雪橇，笑声回荡在整个院子里。小猫悄悄地跑出来，在雪地上留下了一串串梅花般的小脚印，有趣极了。冬天的雪真美啊，我爱这洁白的世界！"},
    {title:"小溪的旅行",content:"山间有一条小溪，它从高高的山上流下来，唱着叮叮咚咚的歌儿向远方奔去。它穿过茂密的树林，给渴了的小树浇水，树叶在风中沙沙作响，好像在说谢谢你。它流过绿油油的草地，和五颜六色的小花打招呼，花儿们微笑着向它点头。它汇入宽阔的小河，带着活泼的鱼儿一起旅行。小溪不怕困难，不管遇到大石头还是急转弯，都不停下脚步，总是勇敢地向前冲去。一路上，它遇到了好多朋友。小鹿来到溪边喝水，感激地说谢谢你，小溪。小鱼在溪水中欢快地游来游去，陪伴着小溪一路前行。岸边的大树倒映在清澈的溪水中，像一幅美丽的画卷。小溪日夜不停地流淌着，终于有一天，它看到了辽阔的大海，它开心地跃入了大海的怀抱。"},
    {title:"学校的早晨",content:"清晨，金色的阳光洒进校园，到处都是暖洋洋的。同学们背着五颜六色的书包，蹦蹦跳跳地走进校门，脸上带着灿烂的笑容。教室里传来朗朗的读书声，同学们读得那么认真，那么投入，像一首美妙的乐曲在校园里回荡。操场上，有的同学在跑步，有的在跳绳，还有的在踢毽子，大家都在锻炼身体。花坛里的花朵带着晶莹的露珠，在阳光下闪闪发光，像一颗颗小钻石。几只小鸟在枝头欢快地唱歌，好像在说同学们早上好。值日生认真地打扫着教室，把桌椅摆得整整齐齐，把黑板擦得干干净净。老师微笑着走进教室，同学们齐声说老师好，新的一天开始了。校园里充满了欢声笑语，学校的早晨真美好啊！"},
    {title:"海边的发现",content:"来到海边，我脱下鞋子，踩在柔软的沙滩上，沙子暖洋洋的，舒服极了。海浪一层一层地涌过来，亲吻着我的脚丫，又轻轻地退回去，留下一圈圈白色的泡沫。我在沙滩上捡到了各种各样的贝壳：有的像扇子，有的像小喇叭，还有的像星星，五颜六色，美丽极了。忽然，我发现了一只小螃蟹，它挥舞着大钳子，横着身子飞快地跑进了沙洞里，真有趣！远处，几只海鸥在海面上盘旋，不时俯冲下去捕捉小鱼。海水碧蓝碧蓝的，在阳光下泛着金色的光芒，一眼望不到边。我用沙子堆了一座大城堡，还挖了一条弯弯曲曲的护城河。海浪涌过来，把我的城堡冲垮了，但我一点也不难过，因为大海给了我无穷的快乐和惊喜。"},
    {title:"森林音乐会",content:"夏天的森林里，一场盛大的音乐会正在举行。知了是男高音，它站在高高的树枝上放声歌唱，歌声嘹亮动听。青蛙是鼓手，它坐在池塘边的荷叶上，鼓着白肚皮敲出咚咚的节奏。蛐蛐是小提琴手，它在草丛里拉出优美婉转的旋律。萤火虫举着小小的灯笼飞来飞去，为大家照明，把舞台装扮得格外美丽。夜风轻轻吹过，树叶沙沙作响，好像在为它们鼓掌喝彩。月亮婆婆露出了慈祥的笑脸，把银色的光芒洒向整个森林。小松鼠抱着松果，坐在树枝上津津有味地听着，小兔子竖起长长的耳朵，一动不动地欣赏着美妙的音乐。小鹿也来了，它静静地站在树丛后面，沉浸在这动听的旋律中。这场森林音乐会真美妙啊，大自然就是最棒的舞台！"},
    {title:"雨后的彩虹",content:"一场大雨过后，天空放晴了，空气里弥漫着清新的泥土气息。太阳公公从云层后面探出头来，笑眯眯地照耀着大地。天边出现了一道美丽的彩虹，红、橙、黄、绿、青、蓝、紫，七种颜色整整齐齐地排在一起，像一座弯弯的彩色拱桥，横跨在蓝天白云之间。我兴奋地指着彩虹喊妈妈快来看，彩虹好美啊！妈妈说，彩虹是雨后大自然送给我们的最美礼物。彩虹的颜色那么鲜艳，那么柔和，好像一条美丽的丝带飘在天空中，又像仙女随手画的一幅水彩画。小鸟们飞出巢穴，在彩虹下欢快地飞翔，叽叽喳喳地唱着歌，好像在赞美彩虹的美丽。地上的水洼映出了彩虹的倒影，好像地上也有一座彩色的桥。渐渐地，彩虹越来越淡，最后消失在蓝天中。但那美丽的画面永远留在了我的心里。"},
    {title:"奶奶的小院",content:"奶奶家有一个温馨的小院子，四季都充满了生机和欢乐。春天，院子里的桃树开满了粉红的花，像一片片彩云落在了枝头，引来了许多蜜蜂和蝴蝶在花间飞舞。夏天，葡萄架上挂满了一串串绿宝石般的葡萄，我每天都要去看看它们熟了没有，盼望着能早日吃到甜甜的葡萄。秋天，石榴咧开嘴笑了，露出一颗颗红宝石一样的籽，咬一口甜滋滋的汁水在嘴里迸开，好吃极了。冬天，腊梅在寒风中傲然绽放，满院子都是淡淡的清香，让人精神一振。奶奶还在院子里开辟了一块小菜地，种了许多新鲜蔬菜，有绿油油的青菜，红彤彤的西红柿，还有长长的黄瓜和圆滚滚的卷心菜。每次去奶奶家，我都能吃到最新鲜最健康的蔬菜。奶奶的小院虽然不大，却充满了温馨和快乐，我爱奶奶的小院！"},
    {title:"风筝飞呀飞",content:"春天是放风筝的好季节，微风习习，阳光明媚。我拿着一只漂亮的花蝴蝶风筝，兴高采烈地来到草地上。一阵风吹来，我赶紧迎着风跑起来，一边跑一边慢慢放线。风筝越飞越高，像一只真的蝴蝶在蓝天上翩翩起舞。线越放越长，风筝越飞越远，我的心情也跟着飞扬起来。旁边的小朋友也带来了各种各样的风筝，有威武的老鹰，有可爱的金鱼，有长长的蜈蚣，还有五彩斑斓的蝴蝶。天空中五颜六色的风筝把蓝天打扮得格外美丽，像一幅五彩缤纷的画。忽然，我的风筝线和别人的缠在了一起，两个风筝在空中打了结。我赶紧收线，好不容易才解开，风筝又重新飞上了蓝天。放风筝真好玩啊，我下次还要来草地上放风筝！"},
    {title:"月亮船",content:"夜晚，月亮升起来了。它弯弯的，像一只金色的小船，在深蓝色的夜空中轻轻地摇晃着。星星们围在月亮身边，像一群好奇的孩子，眨着亮晶晶的眼睛，好像在听月亮讲故事。我想，如果我能坐上月亮船，一定要去银河里划一划，去看看星星们住的地方，去采一颗最亮的星星送给妈妈。月亮船还会变魔术呢！过了几天，它变得圆圆的，像一个金色的大盘子，又亮又圆，把柔和的光芒洒向大地。妈妈说那叫满月，象征着团圆和美满。又过了几天，月亮船又慢慢地变弯了，像一把镰刀挂在天边。月亮船真神奇啊，它每天都在变化着形状，让我充满了好奇和想象。想着想着，我甜甜地笑了，伴着温柔的月光进入了梦乡。在梦里，我真的坐上了月亮船，在星空中快乐地航行。"},
    {title:"小蚂蚁搬家",content:"今天我在院子里发现了一队长长的蚂蚁。它们排着整整齐齐的队伍，有的扛着粮食，有的搬着虫子，急急忙忙地向前走着，像一支训练有素的小军队。我蹲下来仔细观察，发现它们是从墙角的一个小洞里出来的，走向花坛旁边的新家。妈妈说，蚂蚁搬家是要下雨了，它们能提前感知到天气的变化。这些小小的蚂蚁，虽然个头很小，但是它们团结在一起，力量可大了。一只蚂蚁搬不动的大虫子，几只蚂蚁一起搬，很快就搬走了。它们互相帮助，从不偷懒，每只蚂蚁都在努力地工作着。不一会儿，天空果然乌云密布，下起了大雨，小蚂蚁们早已安全地躲进了新家。我从蚂蚁身上学到了一个道理团结就是力量，只要大家齐心协力，就没有克服不了的困难。小小的蚂蚁真了不起啊！"},
    {title:"向日葵的秘密",content:"田野里长满了向日葵，它们个子高高的，脸盘大大的，穿着金黄色的衣裳，像一个个灿烂的小太阳。最神奇的是，向日葵总是面朝太阳的方向，好像在追随着太阳的脚步。早晨，太阳从东边升起，向日葵就朝向东边，像是在迎接太阳的到来；傍晚，太阳落到了西边，向日葵就转向西边，像是在和太阳说再见。原来，向日葵是太阳最忠实的朋友，永远追随阳光的方向。到了秋天，向日葵的花盘里结满了饱满的瓜子，一颗颗紧紧地挤在一起，像排列整齐的小士兵。农民伯伯把瓜子收下来，炒熟了又香又脆，是我们最爱吃的零食。向日葵不仅美丽，还给我们带来了美味的食物，它真是大自然的宝贝。我也要像向日葵一样，永远向着阳光，积极向上，做一个充满正能量的人！"},
    {title:"萤火虫的灯笼",content:"夏天的夜晚，草丛里一闪一闪的，那是萤火虫在飞舞。它们提着小小的灯笼，忽高忽低，忽左忽右，像天上的星星调皮地掉到了人间。我轻轻地伸出手指，一只萤火虫慢慢地停在上面，小灯笼一明一暗，发出淡淡的黄绿色的光芒，真好看。萤火虫虽然很小，却用自己的光照亮了黑夜，给寂静的夜晚增添了一份神秘和浪漫。它们在草丛中飞来飞去，好像在开一场盛大的灯光晚会。青蛙在池塘边为它们伴奏，蟋蟀在草丛里为它们唱歌，夜风吹过树叶沙沙作响，为它们打着节拍。我拿来一个透明的玻璃瓶，小心翼翼地抓了几只萤火虫放进去，瓶子发出了柔和的光芒，像一盏神奇的小灯。但妈妈说萤火虫属于大自然，离开草丛会死掉的，我就把它们放了回去。看着它们重新飞向夜空，我开心地笑了。"},
    {title:"春雨沙沙沙",content:"春雨沙沙沙地下起来了，像一首轻柔的乐曲在天地间奏响。细细的雨丝像牛毛，像花针，像细丝，密密地斜织着，给大地披上了一层薄薄的轻纱。小草贪婪地喝着甘甜的雨水，长得更绿了，远远望去像铺了一块绿色的地毯。桃花瓣上沾满了晶莹的水珠，像戴上了一串串闪亮的珍珠项链，更加娇艳动人了。远处的山峦笼罩在薄薄的雨雾中，若隐若现，就像披上了一层神秘的轻纱。好一场温柔的春雨啊！小燕子在细雨中穿梭飞舞，好像在洗一个舒服的澡。田野里的麦苗喝饱了水，精神抖擞地挺直了腰，好像在说谢谢你，春雨。农民伯伯望着这场及时的好雨，脸上露出了满意的笑容。俗话说春雨贵如油，这场雨来得正是时候，滋润了万物，也滋润了人们的心田。雨停了，天边出现了一道美丽的彩虹，空气里弥漫着泥土和花草的清香。"},
    {title:"池塘里的夏天",content:"夏天的池塘可热闹了！荷叶圆圆的，绿绿的，像一把把撑开的小伞，密密麻麻地铺在水面上。荷花从荷叶中间冒出来，有的粉红如霞，有的雪白如玉，有的含苞待放，有的盛开怒放，美丽极了。青蛙坐在荷叶上呱呱地唱歌，声音洪亮而有节奏，好像在开一场盛大的演唱会。小鱼在水里快活地游来游去，一会儿跃出水面，一会儿又钻入水底，溅起一朵朵小小的水花。一只蜻蜓轻盈地飞过来，轻轻地停在了荷花尖上，这让我想起了一句优美的诗句小荷才露尖尖角，早有蜻蜓立上头。几只水鸟在池塘边悠闲地觅食，偶尔扑通一声钻进水里，叼起一条银光闪闪的小鱼。岸边的柳树垂下长长的枝条，像小姑娘的辫子在水面上轻轻摇摆。夏天的池塘真是一幅美丽的画，我爱这热闹而美丽的池塘！"},
    {title:"落叶的旅行",content:"秋天到了，一片金黄的树叶从树上飘落下来，开始了它奇妙的旅行。它先飞到了高高的屋顶上，看了看烟囱里冒出的袅袅白烟，又随着一阵风飞向了远方。然后，它被风吹到了清澈的小河里，变成了一条金色的小船，顺着水流悠悠地向前漂去。一条小鱼好奇地游过来，把它当成了一把美丽的小雨伞，在下面躲了一会儿。一只小蚂蚁费了好大的劲爬上来，把它当成了一艘渡河的小船，顺利地到达了对岸。落叶继续漂啊漂，最后被水流冲到了岸边的草地上。一个小女孩路过这里，捡起了这片金黄的落叶，惊喜地说这片叶子真漂亮，我要把它夹在书里做书签！从此，落叶在小女孩的书里安了家，每当小女孩翻开书，就能看到它金黄的身影。虽然落叶离开了大树妈妈，但它以另一种方式继续陪伴着我们，给人们带来温暖和美好。"},
    {title:"美丽的日出",content:"为了看日出，我早早地起了床，来到了山顶的观景台。天边先是一片灰蒙蒙的，万物还在沉睡中。慢慢地，东方出现了一抹淡淡的红色，像有人用画笔轻轻地点了一下。接着，红色越来越亮，越来越浓，像一团燃烧的火焰染红了半边天，云彩也被染成了金红色。忽然，一个火红的小半圆从地平线上冒了出来，好像一个害羞的小姑娘悄悄地探出了头。它一点一点地升起，发出耀眼的金色光芒，让人不敢直视。最后，整个太阳猛地跳出了地平线，金色的光芒瞬间洒满了大地，照亮了山川、河流和田野。新的一天开始了！小鸟在枝头欢快地唱歌，好像在迎接太阳的到来。花朵张开了笑脸，小草上的露珠在阳光下闪闪发光。我深深地吸了一口清新的空气，感受着清晨的美好。日出真壮观啊，它给了我满满的希望和力量！"},
    {title:"蝴蝶的舞会",content:"春天的花园里，蝴蝶们举行了一场盛大的舞会。有的蝴蝶穿着金黄色的裙子，在阳光下闪闪发光；有的披着蓝色的纱衣，像天空一样纯净；还有的戴着紫色的花环，优雅而高贵。它们在五颜六色的花丛中翩翩起舞，一会儿飞到东，一会儿飞到西，舞姿优美动人。花儿们仰起脸，微笑着为蝴蝶们鼓掌喝彩。蜜蜂嗡嗡地飞来，为这场舞会欢快地伴奏。一只小蜜蜂羡慕地说蝴蝶姐姐，你们跳得真好看，我也想学跳舞！蝴蝶们听了，跳得更起劲了，它们旋转、翻飞、俯冲，动作行云流水般优美。忽然，一阵温柔的微风吹来，花瓣纷纷扬扬地飘落，像下了一场浪漫的花瓣雨。蝴蝶们在花瓣雨中飞舞，美得像一幅画。这真是一场美丽的舞会，大自然就是最好的舞台，每一个生命都是最棒的舞者！"}
  ],
  texts: [
    {title:"《梅花》",author:"宋·王安石",content:"墙角数枝梅，\n凌寒独自开。\n遥知不是雪，\n为有暗香来。"},
    {title:"《小儿垂钓》",author:"唐·胡令能",content:"蓬头稚子学垂纶，\n侧坐莓苔草映身。\n路人借问遥招手，\n怕得鱼惊不应人。"},
    {title:"《登鹳雀楼》",author:"唐·王之涣",content:"白日依山尽，\n黄河入海流。\n欲穷千里目，\n更上一层楼。"},
    {title:"《望庐山瀑布》",author:"唐·李白",content:"日照香炉生紫烟，\n遥看瀑布挂前川。\n飞流直下三千尺，\n疑是银河落九天。"},
    {title:"《江雪》",author:"唐·柳宗元",content:"千山鸟飞绝，\n万径人踪灭。\n孤舟蓑笠翁，\n独钓寒江雪。"},
    {title:"《夜宿山寺》",author:"唐·李白",content:"危楼高百尺，\n手可摘星辰。\n不敢高声语，\n恐惊天上人。"},
    {title:"《敕勒歌》",author:"北朝民歌",content:"敕勒川，阴山下。\n天似穹庐，笼盖四野。\n天苍苍，野茫茫，\n风吹草低见牛羊。"},
    {title:"《数九歌》",author:"民间童谣",content:"一九二九不出手，\n三九四九冰上走。\n五九六九，沿河看柳。\n七九河开，八九雁来。\n九九加一九，耕牛遍地走。"},
    {title:"《场景歌》",author:"课文",content:"一只海鸥，一片沙滩。\n一艘军舰，一条帆船。\n\n一方鱼塘，一块稻田。\n一行垂柳，一座花园。\n\n一道小溪，一孔石桥。\n一丛翠竹，一群飞鸟。\n\n一面队旗，一把铜号。\n一队红领巾，一片欢笑。"},
    {title:"《树之歌》",author:"课文",content:"杨树高，榕树壮，\n梧桐树叶像手掌。\n枫树秋天叶儿红，\n松柏四季披绿装。\n木棉喜暖在南方，\n桦树耐寒守北疆。\n银杏水杉活化石，\n金桂开花满院香。"},
    {title:"《田家四季歌》",author:"课文",content:"春季里，春风吹，\n花开草长蝴蝶飞。\n麦苗儿多嫩，桑叶儿正肥。\n\n夏季里，农事忙，\n采了蚕桑又插秧。\n早起勤耕作，归来戴月光。\n\n秋季里，稻上场，\n谷像黄金粒粒香。\n身体虽辛苦，心里喜洋洋。\n\n冬季里，雪初晴，\n新制棉衣暖又轻。\n一年农事了，大家笑盈盈。"},
    {title:"《植物妈妈有办法》",author:"课文",content:"孩子如果已经长大，\n就得告别妈妈，四海为家。\n牛马有脚，鸟有翅膀，\n植物旅行又用什么办法？\n\n蒲公英妈妈准备了降落伞，\n把它送给自己的娃娃。\n只要有风轻轻吹过，\n孩子们就乘着风纷纷出发。\n\n苍耳妈妈有个好办法，\n她给孩子穿上带刺的铠甲。\n只要挂住动物的皮毛，\n孩子们就能去田野、山洼。\n\n豌豆妈妈更有办法，\n她让豆荚晒在太阳底下。\n啪的一声，豆荚炸开，\n孩子们就蹦着跳着离开妈妈。"},
    {title:"日积月累·对联名句",author:"语文园地一",content:"有山皆图画，无水不文章。\n\n一畦春韭绿，十里稻花香。\n\n忠厚传家久，诗书继世长。"},
    {title:"日积月累·励志名句",author:"语文园地三",content:"有志者事竟成。\n\n志当存高远。\n\n有志不在年高。"},
    {title:"日积月累·节气歌",author:"语文园地七",content:"春雨惊春清谷天，\n夏满芒夏暑相连。\n秋处露秋寒霜降，\n冬雪雪冬小大寒。"}

function loadData(){

    if(raw){

      const def = getDefaultData();
      appData = Object.assign({},def,appData);
      appData.config = Object.assign({},def.config,appData.config||{});
      appData.tasks = appData.tasks || def.tasks;
      appData.shopItems = appData.shopItems || def.shopItems;
      appData.heartLog = appData.heartLog || [];
      appData.dailyRecords = appData.dailyRecords || {};
      appData.exchangedItems = appData.exchangedItems || [];
      appData.petHappiness = appData.petHappiness || 0;
      appData.petGrowth = appData.petGrowth || 0;
      appData.petFedLog = appData.petFedLog || [];
      appData.lastBackupDate = appData.lastBackupDate || null;
      // 迁移：更新商店商品为食物/玩具体系
      migrateShopItems();
      // 迁移：更新默认任务定义（v2 — 优美句型→优美文章、数学勾选→上传批改）
      migrateTasks();
    }else{
      appData = getDefaultData();
      saveData();
    }
  }catch(e){
    appData = getDefaultData();
  }
}

function migrateTasks(){
  if(!appData.tasks) return;
  const updates = {
    'ch1': {name:'阅读·优美文章', desc:'每日朗读一篇带拼音的优美文章', contentKey:'article'},
    'ch2': {name:'必背课文', desc:'人教版二年级上册：古诗词、课文、日积月累', contentKey:'text'},
    'ma1': {type:'upload', desc:'完成指定页码练习，拍照上传批改'},
    'ma2': {type:'upload', desc:'每日10道口算/计算题，拍照上传批改'},
    'en1': {name:'洪恩英语', desc:'在洪恩英语APP上完成学习任务', type:'check', contentKey:null}
  };
  // 确保家务类别存在
  if(!appData.tasks.housework){
    const def = getDefaultData();
    appData.tasks.housework = def.tasks.housework;
  }
  // 确保生字打卡任务存在
  const chineseTasks = appData.tasks.chinese || [];
  if(!chineseTasks.find(t=>t.id==='ch3')){
    const def = getDefaultData();
    const ch3 = def.tasks.chinese.find(t=>t.id==='ch3');
    if(ch3) chineseTasks.push(ch3);
  }
  // 旧的 ch3 (预备二年级) 改为 ch4
  const oldCh3 = chineseTasks.find(t=>t.id==='ch3' && t.type==='check');
  if(oldCh3 && !chineseTasks.find(t=>t.id==='ch4')){
    oldCh3.id = 'ch4';
  }
  ['chinese','math','english','housework'].forEach(subject=>{
    (appData.tasks[subject]||[]).forEach(task=>{
      if(updates[task.id]){
        const u = updates[task.id];
        if(u.name) task.name = u.name;
        if(u.desc) task.desc = u.desc;
        if(u.contentKey) task.contentKey = u.contentKey;
        else if(u.contentKey === null) delete task.contentKey;
        if(u.type) task.type = u.type;
      }
    });
  });
}

function migrateShopItems(){
  // 检测旧版商品（缺少 type 字段），替换为新版食物/玩具
  if(!appData.shopItems || appData.shopItems.length === 0) return;

// ==================== 工具函数 ====================
function getTodayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function getDaysUntilSchool(){
  const target = new Date(appData.config.schoolStartDate);
  const today = new Date();
  today.setHours(0,0,0,0);
  target.setHours(0,0,0,0);
  const diff = Math.ceil((target - today) / 86400000);
  return Math.max(0, diff);
}

function getDayIndex(){
  const start = new Date(appData.config.vacationStart || '2026-07-01');
  const today = new Date();
  start.setHours(0,0,0,0);
  today.setHours(0,0,0,0);
  return Math.max(0, Math.floor((today - start) / 86400000));
}

function formatTime(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

function formatDateLabel(dateStr){
  const d = new Date(dateStr);
  return (d.getMonth()+1)+'月'+d.getDate()+'日';
}

function ensureDayRecord(dateStr){
  if(!appData.dailyRecords[dateStr]){
    appData.dailyRecords[dateStr] = {tasks:{}, settled:false, settledAt:null};
  }
  return appData.dailyRecords[dateStr];
}

function getTodayRecord(){
  return ensureDayRecord(getTodayStr());
}

function getTaskStatus(dateStr, taskId){
  const rec = ensureDayRecord(dateStr);
  if(!rec.tasks[taskId]) return {completed:false};
  return rec.tasks[taskId];
}

function setTaskStatus(dateStr, taskId, status){
  const rec = ensureDayRecord(dateStr);
  rec.tasks[taskId] = Object.assign({}, rec.tasks[taskId]||{}, status);

}

// ==================== 爱心系统 ====================
function addHearts(amount, reason){
  const oldHearts = appData.hearts;
  if(amount < 0 && appData.hearts <= 0) return;
  appData.hearts = Math.max(0, appData.hearts + amount);
  const actualChange = appData.hearts - oldHearts;
  if(actualChange !== 0){
    appData.heartLog.push({
      date:getTodayStr(),
      time:formatTime(),
      amount:actualChange,
      reason:reason,
      balance:appData.hearts
    });
  }
  saveData();
  return actualChange;
}

function getPetState(hearts){
  const happiness = appData.petHappiness || 0;
  const growth = appData.petGrowth || 0;

  // 成长阶段：0-5小马驹, 6-15少年马, 16+成年马
  let growthStage = 1; // 1=小马驹, 2=少年马, 3=成年马
  if(growth >= 16) growthStage = 3;
  else if(growth >= 6) growthStage = 2;

  // 快乐等级：综合爱心和喂养快乐值
  const totalJoy = hearts + Math.floor(happiness / 2);

  let baseState;
  if(totalJoy >= 15) baseState = {level:4, cls:'state-shiny', labelCls:'s-shiny', label:'🌟 闪耀健康', bodyColor:'#FF69B4', maneType:'rainbow', sparkle:true};
  else if(totalJoy >= 7) baseState = {level:3, cls:'state-happy', labelCls:'s-happy', label:'😊 正常快乐', bodyColor:'#FFB6C1', maneType:'pink', sparkle:false};
  else if(totalJoy >= 1) baseState = {level:2, cls:'state-weak', labelCls:'s-weak', label:'😟 开始瘦弱', bodyColor:'#D4A5A5', maneType:'faded', sparkle:false};
  else baseState = {level:1, cls:'state-sad', labelCls:'s-sad', label:'😢 瘦弱憔悴', bodyColor:'#B0B0B0', maneType:'gray', sparkle:false};

  // 快乐值高时额外加分
  if(happiness >= 10 && baseState.level < 4){
    baseState.sparkle = true;
    baseState.cls = 'state-shiny';
    baseState.labelCls = 's-shiny';
    baseState.label = '🌟 开心闪耀';
  }

  baseState.growthStage = growthStage;
  baseState.happiness = happiness;
  baseState.growth = growth;
  return baseState;
}

function getGrowthLabel(stage){
  if(stage === 3) return '🦋 成年独角兽';
  if(stage === 2) return '🐎 少年小马';
  return ' pony 小马驹';
}

function getPetScale(stage){
  // 小马驹 0.7倍，少年马 0.85倍，成年马 1.0倍
  if(stage === 3) return 1.0;
  if(stage === 2) return 0.85;
  return 0.7;
}

// ==================== 日终结算 ====================
function checkSettlement(){
  const today = getTodayStr();
  const todayDate = new Date(today);
  const vacationStart = new Date(appData.config.vacationStart || '2026-07-01');
  vacationStart.setHours(0,0,0,0);
  
  // 只处理暑假开始到昨天的日期
  let currentDate = new Date(vacationStart);
  while(currentDate < todayDate){
    const dateStr = currentDate.getFullYear()+'-'+String(currentDate.getMonth()+1).padStart(2,'0')+'-'+String(currentDate.getDate()).padStart(2,'0');
    const rec = ensureDayRecord(dateStr);
    if(!rec.settled){
      settleDay(dateStr);
    }
    currentDate.setDate(currentDate.getDate() + 1);
  }
  
  // 今天如果过了提醒时间，也结算
  const now = new Date();
  const reminderHour = parseInt((appData.config.reminderTime||'21:00').split(':')[0]);
  if(now.getHours() >= reminderHour){
    const rec = ensureDayRecord(today);
    if(!rec.settled){
      settleDay(today);
    }
  }
}

function settleDay(dateStr){
  const rec = ensureDayRecord(dateStr);
  if(rec.settled) return;
  
  // 遍历所有启用的任务
  const allTasks = getAllTasks();
  allTasks.forEach(task=>{
    if(!task.enabled) return;
    const status = getTaskStatus(dateStr, task.id);
    if(!status.completed){
      // 未完成扣1爱心
      const oldHearts = appData.hearts;
      appData.hearts = Math.max(0, appData.hearts - 1);
      const actualChange = appData.hearts - oldHearts;
      if(actualChange !== 0){
        appData.heartLog.push({
          date:dateStr,
          time:(appData.config.reminderTime||'21:00'),
          amount:actualChange,
          reason:task.name+' 未完成（日终结算）',
          balance:appData.hearts
        });
      }
    }
  });
  
  rec.settled = true;
  rec.settledAt = new Date().toISOString();
  saveData();
}

function getAllTasks(){
  const tasks = [];
  ['chinese','math','english','housework'].forEach(subject=>{
    (appData.tasks[subject]||[]).forEach(t=>{
      tasks.push(Object.assign({}, t, {subject}));
    });
  });
  return tasks;
}

function findTask(taskId){
  for(const subject of ['chinese','math','english','housework']){
    const task = (appData.tasks[subject]||[]).find(t=>t.id===taskId);
    if(task) return Object.assign({}, task, {subject});
  }
  return null;
}

        <div class="task-reward">${isDone?'✅ +'+(task.reward||1)+'❤️':'⬜ 去完成 →'}</div>
      </div>`;
    });
    
    html += `</div></div>`;
  });
  
  html += `</div>`;
  html += '</div>';
  return html;
}

function renderPetSection(petState){
  let html = '<div class="pet-section">';
  html += '<div class="pet-svg-wrap">';
  html += renderPetSVG(petState);
  html += '</div>';
  html += '<div class="pet-info">';
  html += `<div class="pet-name">🦄 我的小马</div>`;
  html += `<div class="pet-state-label ${petState.labelCls}">${petState.label}</div>`;
  html += `<div class="pet-hearts">❤️ ${appData.hearts} · 😊 ${petState.happiness}</div>`;
  html += `<div style="font-size:12px;color:var(--purple);margin-top:4px">${getGrowthLabel(petState.growthStage)} · 成长值 ${petState.growth}</div>`;
  if(petState.growthStage < 3){
    const nextStageNeed = petState.growthStage === 1 ? 6 : 16;
    const progress = Math.min(100, Math.round(petState.growth / nextStageNeed * 100));
    html += `<div style="width:100%;height:6px;background:#EEE;border-radius:3px;margin-top:4px;overflow:hidden">
      <div style="height:100%;width:${progress}%;background:linear-gradient(90deg,#FFB6C1,#9B59B6);border-radius:3px"></div>
    </div>`;
    html += `<div style="font-size:11px;color:#BBB;margin-top:2px">距离下一阶段还需 ${Math.max(0,nextStageNeed - petState.growth)} 成长值</div>`;
  }else{
    html += '<div style="font-size:11px;color:#FFD700;margin-top:4px">🏆 已长成成年独角兽！</div>';
  }
  html += '</div>';
  html += '</div>';
  return html;
}

function renderTaskDetail(){
  const task = findTask(currentTaskId);
  if(!task) return '<div class="view active"><p>任务未找到</p></div>';
  
  const today = getTodayStr();
  const status = getTaskStatus(today, task.id);
  const isDone = status.completed;
  
  let html = '<div class="view active">';
  html += `<div class="task-detail-header">
    <button class="back-btn" onclick="navigate('home')">←</button>
    <div class="task-detail-title">${task.name}</div>
  </div>`;
  
  if(task.type === 'record'){
    html += renderRecordTask(task, status, isDone);
  }else if(task.type === 'check'){
    html += renderCheckTask(task, status, isDone);
  }else if(task.type === 'upload'){
    html += renderUploadTask(task, status, isDone);
  }else if(task.type === 'character'){
    html += renderCharacterTask(task, status, isDone);
  }
  
  html += '</div>';
  return html;
}

function renderCharacterTask(task, status, isDone){
  const dayIndex = getDayIndex();
  const allChars = Content.characters || [];
  const charsPerDay = 6;
  const startIndex = (dayIndex * charsPerDay) % allChars.length;
  const todayChars = [];
  for(let i=0;i<charsPerDay;i++){
    todayChars.push(allChars[(startIndex+i)%allChars.length]);
  }
  
  const learnedSet = new Set(status.learnedChars || []);
  const allLearned = todayChars.every(c=>learnedSet.has(c.char));
  
  // 生成5个听写词语（从今日生字的组词中选取）
  const dictationWords = [];
  todayChars.forEach(c=>{
    (c.words||[]).forEach(w=>{
      if(dictationWords.length < 5 && !dictationWords.includes(w)){
        dictationWords.push(w);
      }
    });
  });
  
  const dictationStarted = status.dictationStarted || false;
  const dictationImage = status.dictationImage || null;
  
  let html = `<div class="card">
    <div class="card-title"><span>📝 今日生字（${todayChars.length}个）</span></div>
    <div style="font-size:13px;color:#888;margin-bottom:8px">点击生字卡片标记"会读会组词"</div>
    <div class="char-grid">`;
  
  todayChars.forEach(c=>{
    const learned = learnedSet.has(c.char);
    html += `<div class="char-card ${learned?'learned':''}" onclick="toggleCharLearned('${c.char}')">
      <ruby>${c.char}<rt>${c.pinyin}</rt></ruby>
      <div class="char-words">${(c.words||[]).join('、')}</div>
      <div class="char-status">${learned?'✅ 已掌握':'点击标记'}</div>
    </div>`;
  });
  
  html += `</div></div>`;
  
  if(isDone){
    html += `<div class="card" style="text-align:center">
      <div style="font-size:48px;margin-bottom:10px">✅</div>
      <div style="font-size:18px;color:var(--green);font-weight:700">今日生字已全部打卡！</div>`;
    if(dictationImage){
      html += `<img src="${dictationImage}" class="image-preview" style="max-height:300px;margin:10px 0">`;
    }
    html += `<button class="btn btn-secondary" style="margin-top:10px" onclick="navigate('home')">返回首页</button>
    </div>`;
  }else{
    // 听写区域
    html += `<div class="card">
      <div class="card-title"><span>✏️ 生字听写（${dictationWords.length}个词语）</span></div>`;
    
    if(!dictationStarted){
      // 预览模式 - 显示词语
      html += `<div style="font-size:13px;color:#888;margin-bottom:10px">先浏览今日听写词语，准备好纸笔后点击"开始听写"</div>`;
      html += `<div class="dictation-words">`;
      dictationWords.forEach((w,i)=>{
        html += `<div class="dictation-word-item">${i+1}. ${w}</div>`;
      });
      html += `</div>`;
      html += `<button class="btn btn-primary btn-block" style="margin-top:10px" onclick="startDictation()" ${allLearned?'':'disabled'}>
        🎤 开始听写
      </button>`;
      if(!allLearned){
        html += `<div style="text-align:center;font-size:13px;color:#999;margin-top:6px">请先完成全部生字学习</div>`;
      }
    }else{
      // 听写模式 - 词语隐藏
      html += `<div class="dictation-hidden-msg">🙈 听写进行中，词语已隐藏<br><span style="font-size:13px">请凭记忆书写，点击播放按钮听词语</span></div>`;
      html += `<div class="dictation-play-list">`;
      dictationWords.forEach((w,i)=>{
        html += `<div class="dictation-play-item">
          <span class="dictation-number">${i+1}</span>
          <button class="btn btn-sm btn-secondary" onclick="speak('${w.replace(/'/g,"\\'")}','zh-CN')">🔊 播放</button>
        </div>`;
      });
      html += `</div>`;
      html += `<div style="display:flex;gap:8px;margin-top:8px">`;
      html += `<button class="btn btn-primary" style="flex:1" onclick="speakDictationAll()">🔊 依次播放全部</button>`;
      html += `<button class="btn btn-secondary" style="flex:1" onclick="resetDictation()">👁️ 重新查看</button>`;
      html += `</div>`;
      
      // 听写图片上传
      html += `<div style="margin-top:12px">`;
      if(dictationImage){
        html += `<img src="${dictationImage}" class="image-preview" style="max-height:250px">`;
        html += `<button class="btn btn-secondary btn-sm" style="margin-top:6px" onclick="document.getElementById('dictationImageInput').click()">📷 重新上传</button>`;
      }else{
        html += `<div class="upload-area" onclick="document.getElementById('dictationImageInput').click()">
          <div class="upload-icon">📷</div>
          <div class="upload-text">听写完成后，拍照上传听写记录</div>
        </div>`;
      }
      html += `<input type="file" id="dictationImageInput" accept="image/*" capture="environment" style="display:none" onchange="handleDictationImageUpload(event)">`;
      html += `</div>`;
    }
    
    html += `</div>`;
    
    // 提交按钮
    const canSubmit = allLearned && dictationImage;
    html += `<button class="btn btn-success btn-block" id="charSubmitBtn" onclick="submitCharacterTask('${task.id}')" ${canSubmit?'':'disabled'}>
      ✅ 全部完成，提交打卡 (+1❤️)
    </button>
    <div style="text-align:center;font-size:13px;color:#888;margin-top:6px">
      生字 ${learnedSet.size}/${todayChars.length} · 听写 ${dictationImage?'✅ 已上传':'⬜ 未上传'}
    </div>`;
  }
  
  return html;
}

function renderShopItemCard(item){
  const canAfford = appData.hearts >= item.cost;
  const exchanged = appData.petFedLog.some(e=>e.itemId===item.id && e.date===getTodayStr());
  const totalFed = appData.petFedLog.filter(e=>e.itemId===item.id).length;

  return `<div class="shop-item" style="position:relative">
    ${exchanged?'<div class="shop-badge">今日已喂</div>':''}
    <div class="shop-icon">${item.icon}</div>
    <div class="shop-name">${item.name}</div>
    <div style="font-size:12px;color:#888;margin-bottom:4px">${item.desc}</div>
    <div style="font-size:11px;color:var(--pink);margin-bottom:4px">😊+${item.happiness} ${item.growth>0?'📈+'+item.growth:''}</div>
    <div class="shop-cost">❤️ ${item.cost}</div>

    <button class="btn btn-sm ${canAfford&&!exchanged?'btn-primary':'btn-secondary'}"

      ${exchanged?'已喂':canAfford?(item.type==='food'?'🍎 喂食':'🎁 赠送'):'爱心不足'}
    </button>
  </div>`;
}

function renderParentGrading(){
  let html = '<div class="view active">';
  html += `<div class="card">
    <div class="card-title"><span>✅ 数学作业批改</span></div>
    <div style="font-size:13px;color:#888;margin-bottom:10px">查看孩子上传的作业图片，批改后自动计算正确率</div>`;
  
  // 查找所有待批改的数学上传作业
  const pendingGradings = [];
  const gradedRecent = [];
  
  Object.keys(appData.dailyRecords).forEach(dateStr=>{
    const rec = appData.dailyRecords[dateStr];
    if(rec.tasks){
      Object.keys(rec.tasks).forEach(tid=>{
        const task = findTask(tid);
        if(task && task.type === 'upload' && task.subject === 'math' && rec.tasks[tid].completed){
          if(!rec.tasks[tid].graded && rec.tasks[tid].image){
            pendingGradings.push({date:dateStr, taskId:tid, status:rec.tasks[tid]});
          }else if(rec.tasks[tid].graded){
            gradedRecent.push({date:dateStr, taskId:tid, status:rec.tasks[tid]});
          }
        }
      });
    }
  });
  
  pendingGradings.sort((a,b)=>b.date.localeCompare(a.date));
  gradedRecent.sort((a,b)=>b.date.localeCompare(a.date));
  
  if(pendingGradings.length === 0){
    html += '<div style="text-align:center;color:#999;padding:30px">✅ 没有待批改的作业</div>';
  }else{
    pendingGradings.forEach(item=>{
      html += `<div class="grading-card">
        <div style="font-weight:700;color:var(--purple);margin-bottom:6px">📅 ${formatDateLabel(item.date)} 的 ${findTask(item.taskId)?.name || '数学作业'}</div>
        <img src="${item.status.image}" class="grading-image" onclick="window.open('${item.status.image}')">
        <div class="grading-form">
          <label>正确题数：<input type="number" id="correct_${item.date}_${item.taskId}" min="0" value="0" style="width:70px"></label>
          <label>总题数：<input type="number" id="total_${item.date}_${item.taskId}" min="1" value="10" style="width:70px"></label>
          <button class="btn btn-success btn-sm" onclick="gradeMathTask('${item.date}','${item.taskId}')">确认批改</button>
        </div>
      </div>`;
    });
  }
  
  // 最近已批改
  if(gradedRecent.length > 0){
    html += '<div style="margin-top:14px;font-weight:700;color:var(--purple)">📋 最近批改记录</div>';
    gradedRecent.slice(0, 5).forEach(item=>{
      const rate = item.status.correctRate;
      const color = rate >= 90 ? 'var(--green)' : rate >= 70 ? '#FF9800' : 'var(--red)';
      html += `<div class="heart-log-item">
        <span class="log-reason">📅 ${formatDateLabel(item.date)} ${findTask(item.taskId)?.name || '数学作业'}</span>
        <span style="color:${color};font-weight:700">正确率 ${rate}%</span>
      </div>`;
    });
  }
  
  html += '</div></div>';
  return html;
}

function renderParentHistory(){
  let html = '<div class="view active">';
  html += `<div class="card">
    <div class="card-title"><span>📈 爱心变化趋势</span></div>`;
  
  // 生成最近14天的数据
  const days = [];
  for(let i = 13; i >= 0; i--){
    const d = new Date();
    d.setDate(d.getDate() - i);
    const dateStr = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const dayLog = appData.heartLog.filter(l=>l.date===dateStr);
    const change = dayLog.reduce((s,l)=>s+l.amount, 0);
    // 计算当天结束时的余额
    let balance = 0;
    const allLog = appData.heartLog.filter(l=>l.date<=dateStr);
    if(allLog.length > 0){
      balance = allLog[allLog.length-1].balance;
    }
    days.push({date:dateStr, change:change, balance:balance, label:(d.getMonth()+1)+'/'+d.getDate()});
  }
  
  // SVG折线图
  const maxBalance = Math.max(...days.map(d=>d.balance), 10);
  const chartWidth = 600;
  const chartHeight = 180;
  const padding = 35;
  const xStep = (chartWidth - 2*padding) / Math.max(days.length-1, 1);
  const yScale = (val) => chartHeight - padding - (val / maxBalance) * (chartHeight - 2*padding);
  
  let pathD = '';
  let barsHtml = '';
  let dotsHtml = '';
  let labelsHtml = '';
  
  days.forEach((d, i)=>{
    const x = padding + i * xStep;
    const y = yScale(d.balance);
    pathD += (i===0?'M':'L') + x + ',' + y + ' ';
    dotsHtml += `<circle cx="${x}" cy="${y}" r="3" fill="#FF69B4"/>`;
    dotsHtml += `<text x="${x}" y="${y-8}" text-anchor="middle" font-size="10" fill="#9B59B6">${d.balance}</text>`;
    labelsHtml += `<text x="${x}" y="${chartHeight-10}" text-anchor="middle" font-size="9" fill="#AAA">${d.label}</text>`;
    // 柱状图（变化量）
    if(d.change !== 0){
      const barHeight = Math.min(Math.abs(d.change) * 8, 30);
      const barY = d.change > 0 ? y - barHeight - 15 : y + 15;
      const barColor = d.change > 0 ? '#2ECC71' : '#E74C3C';
      barsHtml += `<rect x="${x-4}" y="${d.change>0?barY:y+12}" width="8" height="${barHeight}" fill="${barColor}" opacity="0.6" rx="2"/>`;
    }
  });
  
  html += `<div class="chart-container">
    <svg viewBox="0 0 ${chartWidth} ${chartHeight}" class="chart-svg">
      <defs>
        <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#FF69B4" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="#FF69B4" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <!-- 网格线 -->
      ${[0,0.25,0.5,0.75,1].map(p=>`<line x1="${padding}" y1="${padding + p*(chartHeight-2*padding)}" x2="${chartWidth-padding}" y2="${padding + p*(chartHeight-2*padding)}" stroke="#EEE" stroke-width="1"/>`).join('')}
      <!-- 填充区域 -->
      <path d="${pathD} L ${padding + (days.length-1)*xStep},${chartHeight-padding} L ${padding},${chartHeight-padding} Z" fill="url(#chartGrad)"/>
      <!-- 柱状图 -->
      ${barsHtml}
      <!-- 折线 -->
      <path d="${pathD}" fill="none" stroke="#FF69B4" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- 数据点 -->
      ${dotsHtml}
      <!-- 日期标签 -->
      ${labelsHtml}
    </svg>
    <div style="display:flex;justify-content:center;gap:16px;margin-top:8px;font-size:12px">
      <span style="color:#FF69B4">● 爱心总数</span>
      <span style="color:#2ECC71">■ 当日增加</span>
      <span style="color:#E74C3C">■ 当日扣除</span>
    </div>
  </div>`;
  
  html += '</div>';
  
  // 按日期查看详情
  html += `<div class="card">
    <div class="card-title"><span>📅 历史日期查看</span></div>
    <div style="margin-bottom:10px">
      <select class="form-select" id="historyDateSelect" onchange="showHistoryDetail(this.value)">
        <option value="">选择日期...</option>`;
  
  const sortedDates = Object.keys(appData.dailyRecords).sort().reverse();
  sortedDates.forEach(dateStr=>{
    html += `<option value="${dateStr}" ${dateStr===getTodayStr()?'selected':''}>${formatDateLabel(dateStr)}</option>`;
  });
  
  html += `</select>
    </div>
    <div id="historyDetail"></div>
  </div>`;
  
  html += '</div>';
  
  // 自动显示今天的详情
  setTimeout(()=>showHistoryDetail(getTodayStr()), 0);
  
  return html;
}

function showHistoryDetail(dateStr){
  const container = document.getElementById('historyDetail');
  if(!container) return;
  
  if(!dateStr || !appData.dailyRecords[dateStr]){
    container.innerHTML = '<div style="text-align:center;color:#999;padding:20px">暂无记录</div>';
    return;
  }
  
  const rec = appData.dailyRecords[dateStr];
  const dayLog = appData.heartLog.filter(l=>l.date===dateStr);
  
  let html = '';
  
  // 任务完成情况
  html += '<div style="margin-bottom:10px"><strong>作业完成情况：</strong></div>';
  const allTasks = getAllTasks();
  allTasks.forEach(task=>{
    const status = rec.tasks[task.id] || {completed:false};
    const hasRecording = status.recordingUrl;
    const hasDictation = status.dictationImage;
    html += `<div class="heart-log-item" style="flex-wrap:wrap">
      <span class="log-reason">${status.completed?'✅':'⬜'} ${task.name}</span>
      <div style="display:flex;align-items:center;gap:8px">
        ${hasRecording ? `<button class="btn btn-sm btn-secondary" onclick="playStoredAudio('${hasRecording}')">▶️ 复听录音</button>` : ''}
        ${hasDictation ? `<button class="btn btn-sm btn-secondary" onclick="viewDictationImage('${task.id}','${dateStr}')">📷 查看听写</button>` : ''}
        ${status.image ? `<button class="btn btn-sm btn-secondary" onclick="viewUploadImage('${task.id}','${dateStr}')">📷 查看作业</button>` : ''}
        ${status.completed && status.completedAt?`<span style="font-size:12px;color:#AAA">${new Date(status.completedAt).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}</span>`:''}
      </div>
    </div>`;
  });
  
  // 爱心变化
  html += '<div style="margin:10px 0"><strong>爱心变化：</strong></div>';
  if(dayLog.length === 0){
    html += '<div style="color:#999;text-align:center;padding:10px">当日无爱心变化</div>';
  }else{
    dayLog.forEach(l=>{
      html += `<div class="heart-log-item">
        <span class="log-reason">${l.time} ${l.reason}</span>
        <span class="log-amount ${l.amount>0?'positive':'negative'}">${l.amount>0?'+':''}${l.amount}❤️</span>
      </div>`;
    });
  }
  
  // 结算状态
  html += `<div style="margin-top:10px;font-size:13px;color:#888">
    ${rec.settled?'✅ 已日终结算':'⏳ 尚未结算'}
  </div>`;
  
  container.innerHTML = html;
}

function speakDictationAll(){
  const dayIndex = getDayIndex();
  const allChars = Content.characters || [];
  const charsPerDay = 6;
  const startIndex = (dayIndex * charsPerDay) % allChars.length;
  const todayChars = [];
  for(let i=0;i<charsPerDay;i++){
    todayChars.push(allChars[(startIndex+i)%allChars.length]);
  }
  const words = [];
  todayChars.forEach(c=>{
    (c.words||[]).forEach(w=>{
      if(words.length < 5 && !words.includes(w)) words.push(w);
    });
  });
  
  if(!window.speechSynthesis){
    showToast('当前浏览器不支持语音朗读');
    return;
  }
  speechSynthesis.cancel();
  
  let idx = 0;
  function playNext(){
    if(idx >= words.length) return;
    const utterance = new SpeechSynthesisUtterance(words[idx]);
    utterance.lang = 'zh-CN';
    utterance.rate = 0.7;
    utterance.pitch = 1.1;
    const voice = availableVoices.find(v=>v.lang.startsWith('zh'));
    if(voice) utterance.voice = voice;
    utterance.onend = ()=>{
      idx++;
      if(idx < words.length){
        setTimeout(playNext, 1500);
      }
    };
    speechSynthesis.speak(utterance);
  }
  playNext();
  showToast('🔊 开始依次播放听写词语...');
}

function handleDictationImageUpload(event){
  const file = event.target.files[0];

    const img = new Image();
    img.onload = function(){
      const canvas = document.createElement('canvas');
      const maxW = 1200, maxH = 1200;
      let w = img.width, h = img.height;
      if(w > maxW){h = h*maxW/w; w = maxW;}
      if(h > maxH){w = w*maxH/h; h = maxH;}
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
      const today = getTodayStr();

  };
  reader.readAsDataURL(file);
}

function handleImageUpload(event, taskId){

      const canvas = document.createElement('canvas');
      const maxDim = 600;
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){
        h = (h * maxDim) / w;
        w = maxDim;
      }else if(h > maxDim){
        w = (w * maxDim) / h;
        h = maxDim;
      }
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const compressed = canvas.toDataURL('image/jpeg', 0.6);
      
      const container = document.getElementById('imagePreviewContainer');

// ==================== 录音 ====================
async function toggleRecording(hideText){
  const btn = document.getElementById('recordBtn');
  const timer = document.getElementById('recordTimer');
  const status = document.getElementById('recordStatus');
  
  if(mediaRecorder && mediaRecorder.state === 'recording'){
    // 停止录音
    mediaRecorder.stop();
    // 课文保持隐藏，不恢复显示
    return;
  }
  
  // 开始录音前，自动隐藏课文
  if(hideText){
    const textContent = document.getElementById('textContent');
    const textHidden = document.getElementById('textHidden');
    if(textContent) textContent.style.display = 'none';
    if(textHidden) textHidden.style.display = 'block';
  }
  
  // 开始录音
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    audioChunks = [];
    
    const options = {mimeType:'audio/webm', audioBitsPerSecond:32000};
    try{
      mediaRecorder = new MediaRecorder(stream, options);
    }catch(e){
      mediaRecorder = new MediaRecorder(stream);
    }
    
    mediaRecorder.ondataavailable = (e)=>{
      if(e.data.size > 0) audioChunks.push(e.data);
    };
    
    mediaRecorder.onstop = ()=>{
      const blob = new Blob(audioChunks, {type:'audio/webm'});
      currentRecordingUrl = URL.createObjectURL(blob);
      
      btn.classList.remove('recording');
      btn.innerHTML = '🎙️';
      status.textContent = '录音完成！可以试听或提交';
      
      document.getElementById('playbackSection').style.display = 'flex';
      document.getElementById('submitBtn').disabled = false;
      
      clearInterval(recordingTimer);
      recordingSeconds = 0;
      
      // 停止所有音轨
      stream.getTracks().forEach(track=>track.stop());
    };
    
    mediaRecorder.start();
    btn.classList.add('recording');
    btn.innerHTML = '⏹️';
    status.textContent = '正在录音...点击停止';
    
    // 计时器
    recordingSeconds = 0;
    recordingTimer = setInterval(()=>{
      recordingSeconds++;
      const mm = String(Math.floor(recordingSeconds/60)).padStart(2,'0');
      const ss = String(recordingSeconds%60).padStart(2,'0');
      timer.textContent = mm+':'+ss+' / 00:30';
      if(recordingSeconds >= 30){
        toggleRecording();
      }
    }, 1000);
    
  }catch(e){
    showToast('无法访问麦克风，请检查权限设置');
    console.error(e);
  }
}

function playCurrentRecording(){
  if(currentRecordingUrl){

}

function resetRecording(showText){

function resetRecordingState(){
  currentRecordingUrl = null;
  audioChunks = [];
  if(mediaRecorder && mediaRecorder.state === 'recording'){
    mediaRecorder.stop();
  }
  if(recordingTimer) clearInterval(recordingTimer);
  recordingSeconds = 0;
  
  const btn = document.getElementById('recordBtn');
  const timer = document.getElementById('recordTimer');
  const status = document.getElementById('recordStatus');
  const playback = document.getElementById('playbackSection');
  const submitBtn = document.getElementById('submitBtn');
  
  if(btn){btn.classList.remove('recording'); btn.innerHTML='🎙️';}

  if(status) status.textContent = '点击麦克风开始录音';

  if(submitBtn) submitBtn.disabled = true;
}

  `, ()=>{

    appData.exchangedItems.push({

      date:today,
      time:formatTime(),
      amount:-item.cost,
      reason:action+' '+item.name,
      balance:appData.hearts
    });
    const newStage = getPetState(appData.hearts).growthStage;
    saveData();
    closeModal();

    // 成长阶段提升庆祝

      const stageName = getGrowthLabel(newStage);
      setTimeout(()=>{
        showModal('confirm', '🎉 小马长大了！', `
          <div style="text-align:center;padding:10px 0">
            <div style="font-size:48px;margin-bottom:8px">🦄✨</div>
            <p style="font-size:16px;color:var(--purple);font-weight:700">恭喜！你的小马成长为了 ${stageName}！</p>
            <p style="font-size:13px;color:#888;margin-top:6px">继续喂养，让它变得更强壮吧！</p>
          </div>
        `, ()=>{ closeModal(); });
        showConfetti();
      }, 300);
    }else{
      showToast('🎉 ' + (item.type==='food'?'喂食':'赠送') + '成功！' + item.icon + ' ' + item.name + '（😊+' + item.happiness + (item.growth>0?' 📈+'+item.growth:'') + '）');
    }
    render();
  });
}

function gradeMathTask(dateStr, taskId){
  const correctInput = document.getElementById('correct_'+dateStr+'_'+taskId);
  const totalInput = document.getElementById('total_'+dateStr+'_'+taskId);
  
  const correct = parseInt(correctInput.value) || 0;
  const total = parseInt(totalInput.value) || 1;
  
  if(total < 1 || correct > total || correct < 0){
    showToast('请输入正确的题数');
    return;
  }
  
  const rate = Math.round((correct / total) * 100);
  const rec = ensureDayRecord(dateStr);
  rec.tasks[taskId].graded = true;
  rec.tasks[taskId].gradedAt = new Date().toISOString();
  rec.tasks[taskId].correctCount = correct;
  rec.tasks[taskId].totalCount = total;
  rec.tasks[taskId].correctRate = rate;
  
  // 如果正确率>=90%，奖励额外爱心
  const taskName = findTask(taskId)?.name || '数学作业';
  if(rate >= 90 && !rec.tasks[taskId].bonusAwarded){
    const oldHearts = appData.hearts;
    appData.hearts += 1;
    appData.heartLog.push({
      date:dateStr,
      time:formatTime(),
      amount:1,
      reason:taskName+'正确率≥90% 额外奖励',
      balance:appData.hearts
    });
    rec.tasks[taskId].bonusAwarded = true;
    showToast('🎉 批改完成！正确率 '+rate+'%，奖励额外 1❤️！');
  }else{
    showToast('✅ 批改完成！正确率 '+rate+'%');
  }
  
  saveData();
  render();
}

// ==================== 数据导入导出 ====================

function backupToFile(){
  try{
    const json = JSON.stringify(appData, null, 2);
    const blob = new Blob([json], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const dateStr = new Date().toISOString().slice(0,10);
    const childName = appData.config.childName || '孩子';
    const filename = `暑假作业备份_${childName}_${dateStr}.json`;
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    // 记录备份时间
    appData.lastBackupDate = new Date().toISOString();
    saveData();
    showToast('💾 备份文件已下载！请保存到安全位置');
  }catch(e){
    showToast('备份失败：'+e.message);
  }
}

function restoreFromFile(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const newData = JSON.parse(ev.target.result);
        if(!newData.config || !newData.tasks){
          showToast('文件格式不正确');
          return;
        }
        showModal('confirm', '📂 恢复数据', `
          <p>已读取备份文件：</p>
          <p style="margin-top:6px"><strong>孩子：</strong>${newData.config.childName||'未知'}</p>
          <p><strong>爱心：</strong>${newData.hearts||0} ❤️</p>
          <p><strong>记录天数：</strong>${Object.keys(newData.dailyRecords||{}).length} 天</p>
          <p style="margin-top:8px;color:#E74C3C">⚠️ 此操作将覆盖当前所有数据！</p>
        `, ()=>{
          appData = newData;
          const def = getDefaultData();
          appData = Object.assign({}, def, appData);
          appData.config = Object.assign({}, def.config, appData.config||{});
          saveData();
          closeModal();
          showToast('✅ 数据恢复成功！');
          render();
        });
      }catch(err){
        showToast('文件读取失败：'+err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function checkBackupReminder(){
  if(!appData.lastBackupDate) return true; // 从未备份
  const last = new Date(appData.lastBackupDate);
  const now = new Date();
  const diffDays = (now - last) / (1000 * 60 * 60 * 24);
  return diffDays >= 3;
}

function updateBackupStatus(){
  const el = document.getElementById('backupStatus');
  if(!el) return;
  if(appData.lastBackupDate){
    const last = new Date(appData.lastBackupDate);
    const dateStr = last.toLocaleDateString('zh-CN');
    const now = new Date();
    const diffDays = Math.floor((now - last) / (1000 * 60 * 60 * 24));
    if(diffDays >= 3){
      el.innerHTML = `⏰ 上次备份：${dateStr}（已${diffDays}天），建议尽快备份！`;
      el.style.color = '#E67E22';
    }else{
      el.innerHTML = `✅ 上次备份：${dateStr}`;
      el.style.color = '#27AE60';
    }
  }else{
    el.innerHTML = '⚠️ 还未备份过，建议立即备份以防止数据丢失';
    el.style.color = '#E74C3C';
  }
}

function importData(code){

// ==================== PIN验证 ====================
function showPinModal(onSuccess){
  const modal = document.getElementById('modalOverlay');
  const content = document.getElementById('modalContent');
  
  content.innerHTML = `
    <div class="modal-title">🔒 家长验证</div>
    <div class="modal-body">
      <p style="margin-bottom:10px">请输入家长PIN码：</p>
      <input class="form-input" type="password" id="pinInput" maxlength="6" placeholder="PIN码" autofocus>
      <p style="font-size:12px;color:#999;margin-top:6px">默认PIN码：1234（可在设置中修改）</p>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="verifyPin()">确认</button>
    </div>
  `;
  
  modal.classList.add('active');
  
  window._pinSuccess = onSuccess;
  
  // 回车确认
  setTimeout(()=>{
    const input = document.getElementById('pinInput');
    if(input){
      input.focus();
      input.onkeypress = (e)=>{
        if(e.key === 'Enter') verifyPin();
      };
    }
  }, 100);
}

function verifyPin(){
  const input = document.getElementById('pinInput');
  if(!input) return;
  
  if(input.value === appData.config.parentPin){
    // 先保存回调，再关闭modal（closeModal会清空_pinSuccess）
    const cb = window._pinSuccess;
    closeModal();
    if(cb){
      cb();
    }
  }else{
    showToast('❌ PIN码不正确');
    input.value = '';
    input.focus();
  }
}

// ==================== Modal ====================
function showModal(type, title, bodyHtml, onConfirm){
  const modal = document.getElementById('modalOverlay');
  const content = document.getElementById('modalContent');
  
  let html = `<div class="modal-title">${title}</div>`;
  html += `<div class="modal-body">${bodyHtml}</div>`;
  
  if(onConfirm){
    window._modalConfirm = onConfirm;
    html += `<div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="executeModalConfirm()">确认</button>
    </div>`;
  }
  
  content.innerHTML = html;
  modal.classList.add('active');
}

function executeModalConfirm(){
  const cb = window._modalConfirm;
  window._modalConfirm = null;
  if(cb) cb();
}

function closeModal(){
  const modal = document.getElementById('modalOverlay');
  modal.classList.remove('active');
  window._pinSuccess = null;
}

function showConfetti(){
  const colors = ['#FF69B4','#9B59B6','#5DADE2','#FFD700','#2ECC71','#FF6347','#FF9800'];
  for(let i = 0; i < 50; i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random()*100 + '%';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDelay = Math.random()*0.5 + 's';
    c.style.animationDuration = (1.5 + Math.random()) + 's';
    c.style.borderRadius = Math.random()>0.5?'50%':'0';

    setTimeout(()=>c.remove(), 3000);

function playSound(type){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    
    if(type === 'success'){
      // 上升音阶
      [523, 659, 784].forEach((freq, i)=>{
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = freq;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0, now + i*0.1);
        gain.gain.linearRampToValueAtTime(0.2, now + i*0.1 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i*0.1 + 0.3);
        osc.start(now + i*0.1);
        osc.stop(now + i*0.1 + 0.3);
      });
    }
  }catch(e){
    // 忽略音频错误
  }
}

// ==================== 初始化 ====================
function init(){
  // 加载数据
  loadData();
  
  // 加载TTS语音
  if(window.speechSynthesis){
    loadVoices();
    speechSynthesis.onvoiceschanged = loadVoices;
  }
  
  // 日终结算检查
  checkSettlement();
  
  // 检查URL hash
  if(window.location.hash === '#parent'){
    showPinModal(()=>{
      currentMode = 'parent';
      render();
    });
  }
  
  // 渲染
  render();
  
  // 备份提醒（超过3天未备份时提示）
  if(checkBackupReminder()){
    setTimeout(()=>{
      showToast('⏰ 已超过3天未备份，建议进入设置→备份到文件');
    }, 3000);
  }
  
  // 定时检查结算（每5分钟）
  setInterval(()=>{
    checkSettlement();
  }, 5*60*1000);
  
  // 监听localStorage变化（多标签页同步）
  window.addEventListener('storage', (e)=>{
    if(e.key === STORAGE_KEY && e.newValue){
      try{
        appData = JSON.parse(e.newValue);
        render();
      }catch(err){}
    }
  });
}

// 启动
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
}else{
  init();
}

if('serviceWorker' in navigator){

    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
